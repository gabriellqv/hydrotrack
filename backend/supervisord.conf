[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
user=www-data
autostart=true
autorestart=true
stdout_logfile=/tmp/php-fpm.out.log
stderr_logfile=/tmp/php-fpm.err.log

[program:nginx]
command=nginx -g 'daemon off;'
user=www-data
autostart=true
autorestart=true
stdout_logfile=/tmp/nginx.out.log
stderr_logfile=/tmp/nginx.err.log
