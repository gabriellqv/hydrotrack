<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="HydroTrack - Sistema de telemetria hídrica para monitoramento inteligente de hidrômetros"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>HydroTrack</title>
    <!-- Script de Inicialização Rápida de Tema (Impede piscada branca/FOUC) -->
    <script>
      ;(function () {
        try {
          if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.add('light')
          } else {
            // O padrão do sistema é escuro, então mantemos a cor escura
            document.documentElement.classList.remove('light')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
